# Builds the ordinary edition -- the one that carries nothing of Celeste's and reads the
# game's atlases and FMOD banks from an installed copy at startup. That build needs no
# Celeste to compile, and neither do the checks: everything of theirs that wants an install
# stands down and says so. The bundled edition cannot be built here, since it would have to
# copy 200MB out of a game this machine does not have.
name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  windows:
    runs-on: windows-latest
    # To move the nightly tag and hang the build off it; nothing else here writes.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Zero warnings is the bar this project holds itself to, so hold it here.
      - name: Build
        run: dotnet build DeskMadeline.csproj -c Release -warnaserror

      - name: Check
        run: dotnet run --project tests\DeskMadeline.Tests -c Release

      # Gathered rather than zipped: upload-artifact zips whatever it is given, so zipping it
      # here as well is what puts a zip inside a zip. The download is DeskMadeline-<sha>.zip
      # either way. The two exclusions are the user's own files, which a build never makes
      # but a run does.
      - name: Gather
        id: gather
        run: |
          $stage = New-Item -ItemType Directory -Force -Path stage
          Get-ChildItem bin\Release\net10.0-windows -Exclude settings.txt, pet_debug.log |
            Copy-Item -Destination $stage -Recurse
          "name=DeskMadeline-$($env:GITHUB_SHA.Substring(0, 7))" >> $env:GITHUB_OUTPUT
          "{0:N1} MB" -f ((Get-ChildItem $stage -Recurse -File |
            Measure-Object Length -Sum).Sum / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.gather.outputs.name }}
          path: stage
          if-no-files-found: error

      # As well as the artifact above, which every run keeps and pull requests only have: the
      # build of master also goes out as a release. An artifact is handed only to somebody
      # signed in to GitHub and is swept away after ninety days, and a release is neither.
      #
      # One rolling release rather than one per commit, since a tag and a notification for every
      # push to a desktop pet is a lot of noise for what is always just "the newest build".
      #
      # The tag is moved rather than the release republished: republishing is what notifies
      # everyone watching, and moving it keeps the release's own links pointing at the commit
      # the download was actually built from. Pushing a tag does not start this workflow again;
      # the trigger above is filtered to branches.
      #
      # The two labelled lines in the notes are read back by the pet's update check, which
      # compares that commit against the one stamped into itself. Keep them, and their names.
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "${{ steps.gather.outputs.name }}.zip"
          Compress-Archive -Path stage\* -DestinationPath $zip
          git push -f origin HEAD:refs/tags/nightly

          $short = $env:GITHUB_SHA.Substring(0, 7)
          $committed = git log -1 --format=%cI
          $notes = @"
          This is the latest nightly build of the project.

          commit: $env:GITHUB_SHA
          committed: $committed
          "@
          Set-Content notes.md -Value $notes -Encoding utf8

          gh release view nightly *> $null
          if ($LASTEXITCODE -eq 0) {
            # The name carries the commit, so yesterday's does not sit there beside today's.
            gh release view nightly --json assets -q '.assets[].name' |
              ForEach-Object { gh release delete-asset nightly $_ --yes }
            gh release edit nightly --title "Latest build ($short)" --notes-file notes.md
          } else {
            gh release create nightly --title "Latest build ($short)" --notes-file notes.md
          }
          gh release upload nightly $zip --clobber
